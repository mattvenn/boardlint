[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardlint"
version = "0.1.0"
description = "Design-review checks for KiCad projects, beyond ERC/DRC: buses, power, ratings, layout coupling, with ngspice and Verilog simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
boardlint = "boardlint.cli:main"

[tool.setuptools.packages.find]
include = ["boardlint*"]

[tool.setuptools.package-data]
boardlint = ["library/parts/*.yaml", "sim/verilog/*.v"]

[tool.pytest.ini_options]
testpaths = ["tests"]
