id: sht40
match:
  lcsc: [C2909890]
  value: ["SHT40-AD1B*"]      # the -A variants only: SHT40-BD1B answers at 0x45 and must not match this file
kind: IC
class: humidity_sensor
description: "Relative humidity and temperature sensor, I2C (fixed address 0x44 for the -AD1B variant), built-in heater, DFN-4 1.5 x 1.5 mm"
datasheet: "Sensirion SHT4x datasheet, Version 2, July 2021 (datasheets/C2909890_SHT40-AD1B-R2.pdf)"
provenance:
  source: "datasheets/C2909890_SHT40-AD1B-R2.pdf"
  verified: false
  unverified_fields: [i2c.max_khz]
  notes: >
    Unverified: i2c.max_khz. The datasheet says "I2C fast mode plus" (p.1) and "Supported I2C
    modes are standard, fast mode, and fast mode plus" (4.1 p.8, referring to NXP UM10204) but
    prints no clock frequency; 1000 kHz is the fast-mode-plus limit of that I2C specification,
    not a number read from this datasheet. Everything else was read from the source.
    Device overview p.1 and nomenclature / ordering tables p.15: position 7 "A" = I2C address
    0x44, "B" = 0x45; SHT40-AD1B-R2 "base RH&T accuracy, 0x44 I2C addr." (R2 = reel of 2500).
    Typical application circuit Figure 1 p.3 (rendered page): 100 nF between VDD and GND,
    10 kOhm pull-ups on SDA and SCL. Electrical characteristics Table 3 p.7 (typ at 3.3 V,
    25 C): VDD 1.08 / 3.3 / 3.6 V; power-up/down level 0.6 to 1.08 V; idle 0.1 typ / 1.0 max uA
    at 25 C, 3.4 uA max at 125 C; measuring 350 typ / 500 max uA; average at one measurement
    per second 2.4 / 1.3 / 0.4 uA (high / medium / low repeatability); VIL 0.3 VDD, VIH 0.7 VDD;
    pull-up resistors Rp min 390 Ohm at VDD >= 1.62 V, 820 Ohm below; VOL 0.4 V max at
    VDD > 2.0 V with Rp > 390 Ohm (0.2 VDD below 2.0 V); bus load 400 pF max in fast mode,
    340 pF in fast mode plus. Timings Table 4 p.8: power-up 0.3 typ / 1 ms max; measurement
    1.3 to 8.2 ms. Absolute maximum Table 5 p.8: any pin VSS - 0.3 V to VDD + 0.3 V; no
    absolute supply voltage is given, so the supply has no abs_max. I2C p.8: no clock
    stretching; NACK on a read while busy. Commands Table 7 p.10 (0xFD measure, 0x89 serial
    number, 0x94 soft reset, heater 20 / 110 / 200 mW for 0.1 or 1 s). Heater 4.8 p.11-12:
    "up to ~75mA in the highest power setting ... the power supply has to be strong enough to
    avoid large voltage drops that could provoke a sensor reset"; max duty cycle 5 %. Land
    pattern p.12-13: "Sensirion recommends to not solder the central die pad"; "There shall be
    no copper under the sensor other than at the pin pads"; "The die pad is not directly
    connected to any pin". Pins p.13: 1 SDA, 2 SCL, 3 VDD, 4 VSS.
    No sim section: the part is command based (write a command byte, wait, read 6 bytes with
    CRC) and has no register that a write-address-then-read returns, so ID_REG / ID_VAL cannot
    describe it. The serial number (command 0x89) is unique per device.
    No errata search was done (offline extraction).

supplies:
  - pins: [VDD]
    vmin: 1.08
    vmax: 3.6
    i_typ_ma: 0.35            # while measuring (typ); average at 1 measurement/s is 0.4 to 2.4 uA
    i_max_ma: 0.5             # while measuring (max), heater off
    i_idle_ma: 0.0001         # idle, typ at 25 C (1.0 uA max)
    i_heater_ma: 75           # "up to ~75 mA" while the heater runs at its highest setting (200 mW at 3.3 V), only on a heater command, 1 s at most
    decoupling:
      - {c_min: 100n, count: 1, note: "100 nF between VDD and VSS (typical application circuit, Figure 1)"}
    note: "If firmware uses the heater, the supply must deliver up to about 75 mA without a drop large enough to reset the sensor."

io:
  vih_frac: 0.7
  vil_frac: 0.3
  vol: 0.4                    # max, VDD > 2.0 V with Rp > 390 Ohm
  abs_max_over_supply: 0.3    # any pin: VSS - 0.3 V to VDD + 0.3 V
  tolerant_5v: false

pins:
  SDA:                        # pin 1
    role: i2c_sda
    drive: open_drain
    require:
      - {pullup: {min: 390}, note: "Pull-up on SDA: 10 kOhm in the typical application circuit; not below 390 Ohm at VDD >= 1.62 V (820 Ohm below 1.62 V)"}
  SCL:                        # pin 2
    role: i2c_scl
    drive: input              # "unidirectional input": the sensor never stretches the clock
    require:
      - {pullup: {min: 390}, note: "Pull-up on SCL: 10 kOhm in the typical application circuit; not below 390 Ohm at VDD >= 1.62 V (820 Ohm below 1.62 V)"}
  VDD: {role: power_in}       # pin 3
  VSS: {role: gnd}            # pin 4

i2c:
  addresses: [0x44]           # -AD1B; the -BD1B ordering code is 0x45
  max_khz: 1000               # fast mode plus; frequency not printed in the datasheet (see provenance)
  clock_stretching: false
