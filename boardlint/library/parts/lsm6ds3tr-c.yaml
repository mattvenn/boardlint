id: lsm6ds3tr-c
match:
  lcsc: [C967633]
  value: ["LSM6DS3TR*"]
kind: IC
class: imu
description: "6-axis IMU (3D accelerometer + 3D gyroscope), I2C / SPI, two interrupt outputs, LGA-14L 2.5 x 3 mm"
datasheet: "ST LSM6DS3TR-C, DocID030071 Rev 3, May 2017 (datasheets/C967633_LSM6DS3TR-C.pdf)"
provenance:
  source: "datasheets/C967633_LSM6DS3TR-C.pdf"
  verified: true
  notes: >
    Pin connections 3.1 p.19 (Mode 1: I2C slave or SPI; Mode 2: adds an I2C master for external
    sensors) and pin description Table 2 p.20: 1 SDO/SA0, 2 SDx and 3 SCx ("Connect to VDDIO or
    GND" in Mode 1; MSDA / MSCL in Mode 2), 4 INT1, 5 VDDIO, 6-7 GND, 8 VDD, 9 INT2 (INT2 / DEN;
    also MDRDY in Mode 2), 10-11 NC "Leave unconnected" (note 2: "Leave pin electrically
    unconnected and soldered to PCB"), 12 CS ("1: SPI idle mode / I2C communication enabled;
    0: SPI communication mode / I2C disabled"), 13 SCL, 14 SDA; note 1 on VDDIO and VDD:
    "Recommended 100 nF filter capacitor". Electrical characteristics Table 4 p.24 (Vdd 1.71 /
    1.8 / 3.6 V; Vdd_IO 1.62 V to Vdd + 0.1 V; typical currents: 0.90 mA gyro + accel
    high-performance at 1.6 kHz, 0.45 mA normal mode at 208 Hz, 0.29 mA low-power at 52 Hz,
    accelerometer only 160 / 85 / 9 uA, power-down 3 uA; turn-on time 35 ms; VIH 0.7 VDD_IO,
    VIL 0.3 VDD_IO, VOH VDD_IO - 0.2 V and VOL 0.2 V at 4 mA, "the maximum driving
    capability"). The table gives typical currents only, so i_max_ma is the highest typical
    figure. SPI Table 6 p.26 (10 MHz max), I2C slave Table 7 p.27 (standard 100 kHz, fast
    400 kHz max). Absolute maximum Table 9 p.29 (Vdd -0.3 to 4.8 V; control pins up to
    Vdd_IO + 0.3 V; "Supply voltage on any pin should never exceed 4.8 V"). Digital interfaces
    p.38 ("To select/exploit the I2C interface, the CS line must be tied high (i.e connected
    to Vdd_IO)") and p.39 (SCL and SDA "must be connected to Vdd_IO through external pull-up
    resistors"; address 110101xb: SDO/SA0 to the supply = 1101011b (6Bh), to ground =
    1101010b (6Ah); read/write bytes D5h/D4h and D7h/D6h, Table 13 p.40). Application hints
    Figure 15 p.45 (rendered page): C1 100 nF on VDD, C2 100 nF on VDDIO, "should be placed as
    near as possible to the supply pin"; SDx / SCx "GND or VDDIO"; I2C pull-ups "to be added",
    Rpu = 10 kOhm. Internal pin status Table 18 p.47-48: SDO/SA0, SDx, SCx, SCL, SDA inputs
    without pull-up by default; INT1 / INT2 "output forced to ground" by default; pins 10, 11
    and CS inputs with pull-up by default (30 to 50 kOhm depending on VDDIO; the CS pull-up
    is disabled if I2C_disable = 1 in reg 13h). WHO_AM_I 0Fh fixed at 6Ah (01101010b), Table 19
    p.49 and section 9.12 p.60. CTRL3_C (12h) p.63: PP_OD default 0 = push-pull INT1 / INT2
    (1 = open-drain), H_LACTIVE default 0 = active high.
    SPI mode 3 is inferred from the text p.41 (SPC "is stopped high when CS is high"; data
    driven on the falling edge and captured on the rising edge); the datasheet does not name
    the mode. vmax of VDDIO is Vdd + 0.1 V, recorded as 3.7 V (= 3.6 + 0.1): the schema cannot
    express a limit relative to another rail. SDx / SCx may go to either rail: the schema has
    no "tie to supply or ground", so they carry not_floating. Pins 10 / 11 must stay
    unconnected, which the require vocabulary cannot check either.
    No errata search was done (offline extraction).

supplies:
  - pins: [VDD]
    vmin: 1.71
    vmax: 3.6
    abs_max: 4.8
    i_typ_ma: 0.45            # gyroscope + accelerometer, normal mode, ODR 208 Hz (typ)
    i_max_ma: 0.90            # gyroscope + accelerometer, high-performance mode, ODR 1.6 kHz (typ; no max given)
    i_idle_ma: 0.003          # power-down (typ), the state after power-up
    decoupling:
      - {c_min: 100n, count: 1, note: "C1 100 nF ceramic as near as possible to the VDD pin (pin 8)"}
  - pins: [VDDIO]
    vmin: 1.62
    vmax: 3.7                 # Vdd + 0.1 V
    abs_max: 4.8
    decoupling:
      - {c_min: 100n, count: 1, note: "C2 100 nF ceramic as near as possible to the VDDIO pin (pin 5)"}
    note: "VDDIO must not exceed Vdd + 0.1 V."

io:
  vih_frac: 0.7               # of VDDIO
  vil_frac: 0.3
  voh_drop: 0.2               # VOH = VDDIO - 0.2 V at 4 mA
  vol: 0.2                    # at 4 mA
  i_out_max_ma: 4             # "maximum driving capability" of a digital pad
  abs_max_over_supply: 0.3    # over VDDIO
  abs_max: 4.8
  tolerant_5v: false

pins:
  "SDO/SA0":                  # pin 1
    role: i2c_addr
    internal_pull: none       # input without pull-up by default (a pull-up is enabled only with SIM = 1, SPI 3-wire)
    require:
      - {not_floating: true, note: "SA0 sets the LSB of the I2C address and has no internal pull-up: connect to VDDIO for 0x6B or to GND for 0x6A", when: "I2C mode"}
  SDx:                        # pin 2
    internal_pull: none
    require:
      - {not_floating: true, note: "SDx: connect to VDDIO or GND in Mode 1 (Table 2); in Mode 2 it is the I2C master data line (MSDA)"}
  SCx:                        # pin 3
    internal_pull: none
    require:
      - {not_floating: true, note: "SCx: connect to VDDIO or GND in Mode 1 (Table 2); in Mode 2 it is the I2C master clock line (MSCL)"}
  INT1: {role: irq, drive: push_pull, active: high, note: "default after power-up: output forced to ground; open-drain selectable with PP_OD = 1 in CTRL3_C"}
  INT2: {role: irq, drive: push_pull, active: high, note: "default after power-up: output forced to ground; also DEN input; open-drain selectable with PP_OD = 1 in CTRL3_C"}
  VDDIO: {role: power_in}
  VDD: {role: power_in}
  GND: {role: gnd}
  NC:                         # pins 10 and 11
    role: nc
    internal_pull: up         # 30 k to 50 k
    note: "Leave electrically unconnected, but solder the pad to the PCB."
  CS:                         # pin 12
    role: spi_cs
    active: low
    internal_pull: up         # 30 k to 50 k, on by default; off when I2C_disable = 1
    require:
      - {tie: supply, note: "To use the I2C interface the CS line must be tied high (connected to Vdd_IO); 0 = SPI communication mode / I2C disabled", when: "I2C mode"}
  SCL:                        # pin 13, SCL / SPC
    role: i2c_scl
    drive: input
    require:
      - {pullup: {}, note: "SCL must be connected to Vdd_IO through an external pull-up resistor (10 kOhm in Figure 15)", when: "I2C mode"}
  SDA:                        # pin 14, SDA / SDI / SDO
    role: i2c_sda
    require:
      - {pullup: {}, note: "SDA must be connected to Vdd_IO through an external pull-up resistor (10 kOhm in Figure 15)", when: "I2C mode"}

i2c:
  addresses: [0x6A, 0x6B]
  max_khz: 400
  address_bits: {base: 0x6A, pins: [{pin: SA0, bit: 0}]}   # no default: SA0 has no internal pull

spi:
  modes: [3]
  max_mhz: 10

sim:
  model: i2c_target
  params: {ID_REG: 0x0F, ID_VAL: 0x6A}
  enable: [{pin: CS, level: 1}]   # CS high enables I2C; CS low is SPI mode and I2C is disabled
