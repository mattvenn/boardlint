id: bmp580
match:
  lcsc: [C22391138]
  value: ["BMP58*"]
kind: IC
class: pressure_sensor
description: "Absolute barometric pressure and temperature sensor, I2C / I3C / SPI, one interrupt output, LGA-10 2.0 x 2.0 mm"
datasheet: "Bosch Sensortec BMP580, BST-BMP580-DS004-02, revision 1.2, February 2022 (datasheets/C22391138_BMP580.pdf)"
provenance:
  source: "datasheets/C22391138_BMP580.pdf"
  verified: true
  notes: >
    Key features p.2 (VDD 1.71 to 3.6 V and VDDIO 1.08 to 3.6 V, independent; 12 MHz SPI,
    12.5 MHz I3C, "up to 1MHz I2C (Fm+)"). Electrical characteristics Table 4 p.10-13 (p.12
    also read from the rendered page for the columns): VDD 1.71 / 1.8-3.3 / 3.6 V; VDDIO 1.08 /
    1.2-1.8-3.3 / 3.6 V; supply ramp time 0.01 to 10 ms (footnote a: "For supply ramps
    < 0.01 ms, a 10 Ohm resistor must be connected in series to the power supply"); power-up
    time 2 ms; I2C clock 100 to 1000 kHz; SPI clock 12 MHz at VDDIO >= 1.62 V and 7 MHz below,
    modes 0 and 3; peak current 260 uA max; deep standby 0.55 uA typ (25 C); standby 1.0 uA
    typ (25 C), 3.5 typ / 5.5 max uA at 55 C; low-power mode at 1 Hz 1.3 typ / 1.4 max uA;
    highest resolution at 30 Hz 75 typ / 80 max uA. The table gives total currents at
    VDDIO = VDD without splitting them between the two pins; they are stored on VDD.
    Interface pins Table 5 p.13 and Table 17 p.31: VIL 30 %, VIH 70 %, hysteresis 10 %, VOL
    20 %, VOH 80 % of VDDIO; CSB pull-up 74 / 100 / 131 kOhm. Absolute maximum Table 6 p.13:
    VDD and VDDIO -0.3 to 4.3 V; I/O pins VSSIO - 0.3 V to VDDIO + 0.3 V. Power management p.15
    (VDD and VDDIO in any order; "Holding any interface pin (SDI, SDO, SCK or CSB) at a logical
    high level when VDDIO is switched off can permanently damage the device"). Protocol
    selection 5.1 p.31: I2C / I3C after power-up or soft reset; "For using I2C and I3C, it is
    recommended to hard-wire the CSB line to VDDIO"; "Once the CSB input pin is falling low,
    the I2C/I3C mode is disabled"; SPI is entered after 16 SCK edges with CSB low. CHIP_STATUS
    (0x11) hif_mode p.51: "If CSB goes low ..., I2C interface will be disabled until the next
    power-on-reset". I2C 5.6 p.38: standard, fast and fast mode plus (400 kHz to 1 MHz);
    "slave address ... is 7'h46 for SDO = 1'b0 and 7'h47 for SDO = 1'b1. SDO must not be
    floating when I2C is used, otherwise the I2C device address is undefined". Pin out Table 28
    p.46 (rendered): 1 VDDIO, 2 SCK, 3 VSS, 4 SDI, 5 SDO, 6 CSB, 7 INT ("host INT input, GND
    or DNC"; "GND connection is allowed, as long as the IRQ pin is not activated"), 8-9 VSS,
    10 VDD; 6.2 p.46: "all VSS pins must be connected to GND"; unused INT "recommended to be
    connect it to GND, rather than leaving it floating", with INT_CONFIG.int_en kept disabled.
    I2C connection diagram Figure 21 p.48 (rendered): 100 nF on VDDIO and 100 nF on VDD; CSB
    "Leave open (i2c_csb_pup_en = 1) or connect to VDDIO or VSSIO (i2c_csb_pup_en = 0)"; SDO
    "Connect to VDDIO or VSSIO for I2C slave address selection"; pin 4 is drawn as SDX there.
    Figure 23 p.49: 10 Ohm in series with VDD and VDDIO when the ramp is faster than 10 us.
    Register map p.50-53: CHIP_ID 0x01 reset 0x50; REV_ID 0x02 reset 0x32; DRIVE_CONFIG 0x13
    reset 0x30 (i2c_csb_pup_en = 0: CSB pull-up off by default); INT_CONFIG 0x14 reset 0x35
    (int_en = 0, int_od = 1 open-drain, int_pol = 0 active low, int_mode = 1 latched).
    The datasheet contradicts itself on CSB in I2C mode: Figure 21 and the sentence under it
    allow VDDIO or VSS, while 5.1 and the hif_mode text say CSB low disables I2C. The
    requirement here follows 5.1 (tie to VDDIO). The I2C and I3C sections state no pull-up
    requirement for SCK / SDI, so none is recorded. The series resistor for fast supply ramps
    is conditional on the ramp time and cannot be expressed as a require; it is in the supply
    note. No errata search was done (offline extraction).

supplies:
  - pins: [VDD]
    vmin: 1.71
    vmax: 3.6
    abs_max: 4.3
    i_typ_ma: 0.075           # highest-resolution OSR at 30 Hz, typ (80 uA max); 1.3 uA typ in low-power mode at 1 Hz
    i_max_ma: 0.26            # peak current, maximum
    i_idle_ma: 0.001          # standby, typ at 25 C (deep standby 0.55 uA typ)
    decoupling:
      - {c_min: 100n, count: 1, note: "100 nF from VDD to ground (connection diagrams, Figures 19-23)"}
    note: "If the supply ramps up faster than 0.01 ms (10 us), e.g. a direct battery connection, put 10 Ohm in series with VDD and with VDDIO (Table 4 footnote a, Figure 23)."
  - pins: [VDDIO]
    vmin: 1.08
    vmax: 3.6
    abs_max: 4.3
    decoupling:
      - {c_min: 100n, count: 1, note: "100 nF from VDDIO to ground (connection diagrams, Figures 19-23)"}
    note: "Independent of VDD, any power-up order. Do not hold SDI, SDO, SCK or CSB high while VDDIO is off: current through the ESD diodes can permanently damage the part."

io:
  vih_frac: 0.7               # of VDDIO
  vil_frac: 0.3
  voh_frac: 0.8
  vol_frac: 0.2
  abs_max_over_supply: 0.3    # over VDDIO
  tolerant_5v: false

pins:
  VDDIO: {role: power_in}     # pin 1
  SCK:                        # pin 2, I2C SCL / SPI clock
    role: i2c_scl
    drive: input
  VSS:                        # pins 3, 8, 9
    role: gnd
    require:
      - {tie: gnd, note: "all VSS pins must be connected to GND"}
  "SDI/SDX":                  # pin 4, I2C SDA / SPI data in (SDX in the connection diagrams)
    role: i2c_sda
  SDO:                        # pin 5
    role: i2c_addr
    require:
      - {not_floating: true, note: "SDO must not be floating when I2C is used, otherwise the device address is undefined: VSS = 0x46, VDDIO = 0x47", when: "I2C mode"}
  CSB:                        # pin 6
    role: spi_cs
    active: low
    internal_pull: none       # a 100 kOhm (74 to 131 k) pull-up exists but is off by default (DRIVE_CONFIG.i2c_csb_pup_en = 0)
    require:
      - {tie: supply, note: "For I2C / I3C it is recommended to hard-wire CSB to VDDIO: once CSB falls low the I2C / I3C mode is disabled until the next power-on or soft reset (5.1, CHIP_STATUS.hif_mode)", when: "I2C or I3C mode"}
  INT:                        # pin 7
    role: irq
    drive: open_drain         # reset value of INT_CONFIG: int_od = 1 (push-pull selectable), int_en = 0 (pin disabled)
    active: low               # reset value int_pol = 0
    require:
      - {not_floating: true, note: "If INT is not used, connect it to GND rather than leaving it floating, and keep INT_CONFIG.int_en disabled (if it must stay open, set int_en = 1 and int_od = 0 instead)", when: "INT not used"}
  VDD: {role: power_in}       # pin 10

i2c:
  addresses: [0x46, 0x47]
  max_khz: 1000
  address_bits: {base: 0x46, pins: [{pin: SDO, bit: 0}]}   # no default: floating SDO = undefined address

spi:
  modes: [0, 3]
  max_mhz: 12                 # at VDDIO >= 1.62 V and Cbus <= 80 pF; 7 MHz below 1.62 V

sim:
  model: i2c_target
  params: {ID_REG: 0x01, ID_VAL: 0x50}
  enable: [{pin: CSB, level: 1}]   # CSB low disables the I2C / I3C interface
