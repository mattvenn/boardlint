id: ao3401a
match:
  lcsc: [C15127]
  value: ["AO3401A"]
kind: Q
class: mosfet
description: "30 V P-channel MOSFET, 4 A, 60 mOhm at -4.5 V, SOT-23"
datasheet: "Alpha & Omega AO3401A, Rev 3.1, December 2023 (datasheets/C15127.pdf)"
provenance:
  source: "datasheets/C15127.pdf"
  verified: true
  notes: >
    Absolute maximum ratings p.1 (VDS -30 V, VGS +/-12 V, ID -4 A at 25 C / -3.2 A at 70 C,
    pulsed -27 A, PD 1.4 W at 25 C, TJ 150 C; R theta JA 100 typ / 125 max C/W steady state).
    Electrical characteristics p.2: VGS(th) -0.5 / -0.9 / -1.3 V at -250 uA; RDS(on) max 50 mOhm
    at VGS = -10 V (41 typ), 60 mOhm at -4.5 V (47 typ), 85 mOhm at -2.5 V (60 typ); body diode
    -0.7 typ / -1 V max at -1 A, 2 A continuous; Ciss 645 pF; Qg 14 nC at 10 V, 7 nC at 4.5 V.
    All values are stored as magnitudes (the device is P-channel). No RDS(on) is specified below
    |VGS| = 2.5 V. Pin numbers are only in the package drawing (not in the extracted text) and
    were not read.

pins:
  G: {drive: input}
  S: {}
  D: {}

fet:
  channel: p
  vds_max: 30
  vgs_max: 12
  id_max_a: 4                 # TA = 25 C; 3.2 A at 70 C
  id_pulse_a: 27
  vgs_th_min: 0.5
  vgs_th_typ: 0.9
  vgs_th_max: 1.3
  rds_on:                     # maximum at 25 C
    - {vgs: 10, mohm: 50}
    - {vgs: 4.5, mohm: 60}
    - {vgs: 2.5, mohm: 85}
  body_diode_vf: 1.0          # max at 1 A (0.7 typ)
  body_diode_if_a: 2
  ciss_pf: 645
  qg_nc: 14                   # at VGS = 10 V; 7 nC at 4.5 V
  pd_w: 1.4
  theta_ja: 125               # steady state, max, on 1 in2 FR-4 with 2 oz copper
  tj_max: 150
