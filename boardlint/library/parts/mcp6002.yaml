id: mcp6002
match:
  lcsc: [C7377]
  value: ["MCP6002*"]
kind: IC
class: opamp
description: "Dual 1 MHz rail-to-rail input / output CMOS op amp, 1.8 V to 6.0 V, 100 uA per amplifier"
datasheet: "Microchip MCP6001/1R/1U/2/4, DS20001733L, 2020 (ww1.microchip.com/downloads/en/DeviceDoc/MCP6001-1R-1U-2-4-1-MHz-Low-Power-Op-Amp-DS20001733L.pdf)"
provenance:
  source: "https://ww1.microchip.com/downloads/en/DeviceDoc/MCP6001-1R-1U-2-4-1-MHz-Low-Power-Op-Amp-DS20001733L.pdf (50 pages, opened 2026-11-24)"
  verified: true
  notes: >
    Features p.1 (GBWP 1 MHz typ, rail-to-rail input / output, 1.8 V to 6.0 V, IQ 100 uA typ,
    phase margin 90 degrees typ, 45 degrees typ with a 500 pF load; MCP6002 8-lead PDIP / SOIC /
    MSOP / DFN: 1 VOUTA, 2 VINA-, 3 VINA+, 4 VSS, 5 VINB+, 6 VINB-, 7 VOUTB, 8 VDD, same in
    Table 3-1 p.11). Absolute maximum p.3: VDD - VSS 7.0 V; analog inputs VSS - 1.0 V to
    VDD + 1.0 V and +/-2 mA; all other inputs and outputs VSS - 0.3 V to VDD + 0.3 V; output and
    supply pins +/-30 mA; output short circuit continuous. DC specifications p.3: offset
    +/-4.5 mV max; bias current 1 pA typ (19 pA at 85 C); common-mode range VSS - 0.3 V to
    VDD + 0.3 V; output swing VSS + 25 mV to VDD - 25 mV (VDD = 5.5 V, 0.5 V overdrive, RL =
    10 k to VDD / 2); short-circuit current 6 mA typ at 1.8 V, 23 mA typ at 5.5 V; supply 1.8 to
    6.0 V (note 2: the other limits are measured at 1.8 V and 5.5 V); IQ per amplifier 50 / 100 /
    170 uA. AC p.4: GBWP 1.0 MHz, slew rate 0.6 V/us, noise 28 nV/rtHz at 1 kHz. Section 4.1.3
    p.13 (the two input stages hand over at VCM = VDD - 1.1 V). Section 4.3 p.14 (capacitive
    loads: above 100 pF at G = +1 a series output resistor RISO improves phase margin; Figure
    4-4, drawn for VDD = 5.0 V, was read off the rendered page at about 400 ohm for 1 nF at
    GN = 1; a graph reading, not a table value). Section 4.4 p.14 (local bypass 0.01 uF to
    0.1 uF within 2 mm of VDD, bulk 1 uF or larger within 100 mm, which may be shared).
    Computed, not printed: supply current for the package = 2 amplifiers x 100 / 170 uA.
    Pins are keyed by number because KiCad's op-amp symbols leave the output names empty.

supplies:
  - pins: ["#8", VDD, "V+"]
    vmin: 1.8
    vmax: 6.0
    abs_max: 7.0
    i_typ_ma: 0.2             # 2 x 100 uA, no load
    i_max_ma: 0.34            # 2 x 170 uA, no load
    decoupling:
      - {c_min: 10n, count: 1, max_mm: 2, note: "local bypass 0.01 uF to 0.1 uF within 2 mm of the VDD pin (section 4.4)"}
      - {c_min: 1u, count: 1, max_mm: 100, note: "bulk 1 uF or larger within 100 mm; may be shared with nearby analog parts (section 4.4)"}

io:
  abs_max_over_supply: 0.3    # outputs and "all other" pins; the analog inputs allow 1.0 V at up to 2 mA
  tolerant_5v: false

pins:
  "#1": {name: VOUTA, drive: analog}
  "#2": {name: VINA-, role: analog_in, drive: analog, abs_max_over_supply: 1.0}
  "#3": {name: VINA+, role: analog_in, drive: analog, abs_max_over_supply: 1.0}
  "#4": {name: VSS, role: gnd}
  "#5": {name: VINB+, role: analog_in, drive: analog, abs_max_over_supply: 1.0}
  "#6": {name: VINB-, role: analog_in, drive: analog, abs_max_over_supply: 1.0}
  "#7": {name: VOUTB, drive: analog}
  "#8": {name: VDD, role: power_in}

opamp:
  channels: 2
  gbw_mhz: 1.0
  slew_v_per_us: 0.6
  phase_margin_deg: 90
  rail_to_rail_input: true
  rail_to_rail_output: true
  vcm_beyond_rails_v: 0.3     # common-mode range VSS - 0.3 V to VDD + 0.3 V
  out_swing_from_rail_mv: 25  # RL = 10 k, VDD = 5.5 V
  vos_max_mv: 4.5
  ib_typ_pa: 1
  isc_ma: {1.8: 6, 5.5: 23}   # typ
  iq_per_amp_ua: [50, 100, 170]
  input_i_max_ma: 2
  cap_load: "above 100 pF at unity gain add a series output resistor (section 4.3); Figure 4-4 reads about 400 ohm for 1 nF at GN = 1, VDD = 5 V"
  crossover_distortion_at: "VCM = VDD - 1.1 V (input stage hand-over)"
