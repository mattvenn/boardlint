id: ss14
match:
  lcsc: [C2480]
  value: ["SS14"]
kind: D
class: schottky
description: "Schottky barrier rectifier, 40 V, 1 A, SMA (DO-214AC)"
datasheet: "MDD (Microdiode Semiconductor) SS12 THRU SS1200, Rev 2025A5 (the PDF LCSC serves for C2480)"
provenance:
  source: "https://datasheet.lcsc.com/datasheet/pdf/9977bb85cd7e349115b7bcb7054cfa0d.pdf (MDD SS12 THRU SS1200, 3 pages; linked from https://www.lcsc.com/product-detail/C2480.html), downloaded 2026-11-24"
  verified: true
  notes: >
    "Maximum Ratings And Electrical Characteristics" table p.1, SS14 column, 25 C ambient
    (column boundaries checked on the rendered page): VRRM 40 V, VRMS 28 V, DC blocking 40 V;
    average forward rectified current 1.0 A; peak forward surge 25 A (8.3 ms half sine);
    maximum instantaneous forward voltage 0.55 V at 1.0 A (SS12 to SS14); maximum DC reverse
    current at rated voltage 0.3 mA at 25 C and 10 mA at 100 C (SS12 to SS16); junction
    capacitance 110 pF typ at 4 V, 1 MHz; thermal resistance junction to ambient 90 C/W typ
    on 5 x 5 cm copper pads; operating junction -55 to +150 C. "Color band denotes cathode
    end". diode.vf is the MAXIMUM at the full 1 A; at light load the drop is lower (Fig. 3 is
    a typical curve only, no figure read from it). The reverse leakage rises steeply with
    temperature: it matters where the diode is meant to block (back-feed protection). The
    value glob matches any maker's SS14: forward voltage and leakage differ between makers;
    these are MDD's numbers.

diode:
  vr_max: 40
  vrrm: 40
  if_max_ma: 1000             # average rectified
  ifsm_a: 25
  vf: 0.55                    # maximum, at 1 A, 25 C
  vf_max: 0.55
  vf_at_ma: 1000
  ir_max_ua: 300              # at 40 V, 25 C
  ir_max_100c_ua: 10000       # at 40 V, 100 C
  cj_pf: 110
  theta_ja: 90
  tj_max: 150
