id: dmg2305ux
match:
  lcsc: [C150470]             # Diodes DMG2305UX-7 (LCSC product page title read 2026-11-25); C5261054 is another maker's part, see errata
  value: ["DMG2305UX*"]
kind: Q
class: mosfet
description: "20 V P-channel MOSFET, 4.2 A, 52 mOhm at -4.5 V, +/-8 V gate, SOT23"
datasheet: "Diodes Incorporated DMG2305UX, DS36196 Rev. 8 - 2, July 2021"
provenance:
  source: "https://datasheet.lcsc.com/datasheet/pdf/47e4eca1ed8982a4ce6cf0c3e9eb9c9f.pdf (Diodes DMG2305UX, DS36196 Rev. 8 - 2, July 2021, 6 pages: the manufacturer PDF LCSC serves for C150470, DMG2305UX-7), downloaded 2026-11-25. https://www.diodes.com/assets/Datasheets/DMG2305UX.pdf is not reachable from this session."
  verified: true
  notes: >
    Product summary p.1 (BVDSS -20 V; RDS(on) max 52 mOhm at VGS = -4.5 V, 100 mOhm at
    -2.5 V). Maximum ratings p.2: VDSS -20 V, VGSS +/-8 V, continuous drain current at
    VGS = -4.5 V -4.2 A at 25 C / -3.3 A at 70 C steady state (-5.0 / -4.0 A for t < 10 s),
    pulsed -15 A (10 us, 1 % duty). Thermal p.2: PD 1.4 W; junction to ambient 90 C/W steady
    state, 64 C/W for t < 10 s (FR-4, 2 oz copper, 1 inch square copper plate); junction to
    case 33 C/W; TJ -55 to 150 C. Electrical characteristics p.2 (25 C): IDSS -1.0 uA max at
    VDS = -20 V; IGSS +/-100 nA max at VGS = +/-8 V; VGS(th) -0.5 min / -0.9 V max at
    -250 uA (no typical value); RDS(on) 40 typ / 52 mOhm max at VGS = -4.5 V, ID = -4.2 A;
    52 / 100 at -2.5 V, -3.4 A; 68 / 200 at -1.8 V, -2 A; Ciss 808, Coss 85, Crss 77 pF at
    VDS = -15 V; gate resistance 15.2 Ohm; Qg 10.2 nC at VGS = -4.5 V (Qgs 1.3, Qgd 2.2).
    All values are stored as magnitudes (the device is P-channel). The body-diode forward
    voltage is only a graph (Figure 8, p.4), so none is recorded. No RDS(on) is specified
    below |VGS| = 1.8 V. The pinout is a drawing without pin numbers (p.1: D alone on one
    side, G and S on the other), so pin numbers were not read.
    OTHER MAKER. LCSC C5261054 is also called "DMG2305UX-7" but is made by HXY MOSFET
    (Shenzhen HuaXuanYang). Its 6-page datasheet was read too and differs: VGS +/-12 V,
    ID -5 A, pulsed -14 A, PD 1.31 W, junction to ambient 120 C/W, RDS(on) 35 typ / 45 max at
    -4.5 V, 45 / 60 at -2.5 V, 65 / 85 mOhm at -1.8 V, VGS(th) -0.4 to -1.0 V, IDSS -1 uA at
    -16 V, Ciss 857 typ / 1200 pF max, body diode -1 V max at -1 A. The fields below are the
    Diodes figures. Between the two, Diodes is the worst case for gate voltage (8 V) and
    RDS(on); HXY is the worst case for threshold (1.0 V) and thermal resistance (120 C/W).
    No errata search was done.

pins:
  G: {drive: input}
  S: {}
  D: {}

fet:
  channel: p
  vds_max: 20
  vgs_max: 8
  id_max_a: 4.2               # steady state at TA = 25 C, VGS = -4.5 V; 3.3 A at 70 C; 5.0 A for under 10 s
  id_pulse_a: 15
  vgs_th_min: 0.5
  vgs_th_max: 0.9             # no typical value in the table
  rds_on:                     # maximum at 25 C
    - {vgs: 4.5, mohm: 52}
    - {vgs: 2.5, mohm: 100}
    - {vgs: 1.8, mohm: 200}
  rds_on_typ:
    - {vgs: 4.5, mohm: 40}
    - {vgs: 2.5, mohm: 52}
    - {vgs: 1.8, mohm: 68}
  idss_max_ua: 1              # at VDS = -20 V, VGS = 0
  igss_max_na: 100            # at VGS = +/-8 V
  ciss_pf: 808
  coss_pf: 85
  crss_pf: 77
  qg_nc: 10.2                 # at VGS = -4.5 V
  rg_ohm: 15.2
  pd_w: 1.4
  theta_ja: 90                # steady state, on 1 in2 FR-4 with 2 oz copper
  theta_jc: 33
  tj_max: 150

errata:
  - id: lcsc-c5261054-is-not-the-diodes-part
    summary: >-
      LCSC C5261054 is sold as "DMG2305UX-7" but is made by HXY MOSFET, not Diodes. Its own
      datasheet gives a +/-12 V gate rating (Diodes +/-8 V), threshold -0.4 to -1.0 V (Diodes
      -0.5 to -0.9 V), RDS(on) 45 / 60 / 85 mOhm max at -4.5 / -2.5 / -1.8 V (Diodes 52 / 100 /
      200), PD 1.31 W and 120 C/W junction to ambient (Diodes 1.4 W, 90 C/W). The genuine
      Diodes part is LCSC C150470. A circuit that leans on the exact threshold or RDS(on),
      such as a current source or a linear-region pass element, should be checked against
      the part that is actually fitted.
    source: "https://www.lcsc.com/product-detail/C5261054.html and its datasheet https://datasheet.lcsc.com/datasheet/pdf/b91d074ff27bcf2102159ebbd6d79f51.pdf (HXY DMG2305UX-7, 6 pages, p.1-2 read 2026-11-25)"
    severity: warning
