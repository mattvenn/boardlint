- id: rocket-usb-esd-swap
  repo: https://github.com/chipsalliance/rocket-pcb
  licence: Apache-2.0
  bug: D+/D- swapped at the USB ESD protection part
  parent: 5f3d34fceaea13834ab8551074b13d007084aec3
  fix: e67bb53fb82c8b94ebf6a2dea63f5e5bda0cdb82
  project: fmc_usb_gpio_spi_jtag.kicad_sch
  args: [--netlist-from, sch]      # the fix changed the schematic only; the board file was not updated
