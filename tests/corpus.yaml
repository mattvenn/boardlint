# Public KiCad projects where one commit fixes a real hardware mistake.
# tools/regress.py checks out the parent (buggy) and the fix, runs boardlint on both, and reports
# which findings exist only before the fix.  Nothing from these repositories is vendored here.
- id: crystal-uart
  repo: https://github.com/SeraphimlabsLLC/Crystal
  licence: AGPL-3.0
  bug: UART TX/RX swapped on the COM port
  parent: d6c00a32267d501c220160374b53eb729bc3095f
  fix: e8c4f8813faa2105cd55cbfa64c780fddfe345c2
  project: Hardware/Crystal/Crystal.kicad_sch
  expect: [uart.direction]
  detectable: false   # TX/RX order on an unlabelled 4-pin header: only the mating cable's pinout says which is right
- id: reflow-oven-cc
  repo: https://github.com/corybuecker/reflow-oven
  licence: MIT
